<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#1a1c8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- 🌟 แก้ไข Meta Tag ตรงนี้เป็น default -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>ThaID Full Feature</title>
  <!-- ฟอนต์ Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ไอคอน FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1c8f;
      overflow: hidden;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      width: 100%;
    }

    /* 🌟 กรอบหลักของแอป */
    .app-container {
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: 0;
      height: auto;          
      max-height: none;
      max-width: none;
      width: auto;
      border: none;
      border-radius: 0;
      background: #1a1c8f;
      display: flex;
      flex-direction: column;
      box-shadow: none;
      overflow: hidden;
    }

    input[type="file"] { display: none; }

    /* 🌟 ส่วนหัว */
    header {
      color: white;
      background: #1a1c8f;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
      padding: calc(env(safe-area-inset-top) + 12px) 20px 20px 20px;
      isolation: isolate;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 12px; }

    .avatar-container { position: relative; cursor: pointer; border-radius: 50%; }
    .avatar-container:active { transform: scale(0.95); }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; background-color: #ccc;
      background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.3);
      background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80');
    }

    .user-text p { font-size: 11px; color: #d1d5db; }
    .user-text h1 { font-size: 15px; font-weight: 600; margin-top: 2px;}

    .header-icons { display: flex; gap: 12px; font-size: 18px; }
    .header-icons i {
      width: 38px; height: 38px;
      background: rgba(0, 0, 0, 0.25); 
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .header-icons i:active { background: rgba(0, 0, 0, 0.4); }

    .online-badge {
      background: #22c55e; color: white; font-size: 8px; font-weight: bold;
      padding: 2px 6px; border-radius: 4px; margin-left: 4px;
      display: inline-flex; align-items: center; gap: 3px; vertical-align: middle;
    }
    .online-dot { width: 4px; height: 4px; background: white; border-radius: 50%; }

    /* 🌟 พื้นที่สกอลล์ */
    .main-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .main-scroll-area::-webkit-scrollbar { display: none; }

    /* พื้นที่ส่วนกลาง (สีน้ำเงิน) */
    .blue-section {
      padding: 0 16px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* --- บัตรประชาชน --- */
    .card-wrapper {
      width: 100%; height: 220px; perspective: 1000px; position: relative;
    }

    .card-inner {
      width: 100%; height: 100%; transition: transform 0.6s;
      transform-style: preserve-3d; position: relative; cursor: pointer;
    }

    .card-inner.is-flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); overflow: hidden; background: #fff;
    }

    .card-back { transform: rotateY(180deg); }

    .card-image { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 🌟 หน้า Lock */
    .lock-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 12px; 
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10;
    }

    .lock-icon-svg { width: 56px; height: 56px; fill: #333; margin-bottom: 12px; }
    .lock-text { font-size: 16px; font-weight: 600; color: #333; }

    /* ปุ่มเมนูใต้บัตร */
    .card-action-bar { margin-top: 15px; display: flex; justify-content: center; gap: 12px; width: 100%; }
    
    .card-action-btn {
      background: #2b359c; color: white; border: none;
      padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.2s; font-family: inherit;
    }
    .card-action-btn:active { transform: scale(0.95); }
    
    .card-action-btn.icon-only { 
      padding: 0; width: 36px; height: 36px; border-radius: 50%; 
      display: flex; justify-content: center; align-items: center;
    }

    /* 🌟 พื้นที่สีขาวด้านล่าง */
    .white-section {
      flex: 1; 
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      margin-top: 20px;
      padding-top: 24px;
      position: relative;
      z-index: 20;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 20px 16px 20px; }
    .section-title h2 { font-size: 15px; color: #333; font-weight: 600; }
    .section-title a { font-size: 12px; color: #888; text-decoration: none; }

    /* 🌟 เมนูบริการ */
    .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 20px; }
    .menu-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; }
    
    .menu-icon { 
      width: 52px; height: 52px; 
      background: #eceef2; 
      border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
    }

    .menu-icon svg {
      width: 28px; height: 28px;
      stroke: #1a1c8f; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    
    .menu-item span { font-size: 11px; color: #6b7280; line-height: 1.2; }

    /* สไลเดอร์ */
    .carousel-wrapper {
      overflow-x: auto;
      scrollbar-width: none; 
      margin-top: 24px;
      padding: 0; 
      position: relative;
    }
    .carousel-wrapper::-webkit-scrollbar { display: none; }

    .carousel-track {
      display: flex;
      gap: 12px;
      width: max-content;
      padding: 0 10%; 
    }

    .banner {
      flex: 0 0 auto; border-radius: 12px; overflow: hidden;
      position: relative; height: 90px; background: #e5e7eb; cursor: pointer;
    }

    .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }

    .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    /* จุดบอกตำแหน่ง */
    .carousel-dots {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      margin-top: 12px; margin-bottom: 24px; 
    }

    .dot-indicator {
      width: 8px; height: 8px; border-radius: 50%; background-color: #d1d5db;
      transition: all 0.3s ease;
    }

    .dot-indicator.active {
      width: 24px; border-radius: 4px; background-color: #1a1c8f;
    }

    /* 🌟 ประกาศทั้งหมด */
    .announcement-vertical-list {
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 20px; margin-bottom: 20px;
    }

    .announcement-vertical-box {
      width: 100%; height: 80px; border-radius: 12px;
      background: #f1f5f9; overflow: hidden; position: relative;
      cursor: pointer; border: 1px solid #e2e8f0;
    }

    .announcement-vertical-box .banner-bg-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }

    .announcement-vertical-box .banner-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      color: #9ca3af; font-size: 24px; z-index: 0;
    }

    /* 🌟 แถบเมนูล่าง */
    .bottom-nav {
      position: absolute; 
      left: 0; right: 0; bottom: 0;
      width: auto;
      background: white;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 max(20px, env(safe-area-inset-bottom)) 0;
      border-top: 1px solid #eee;
      z-index: 30;
    }

    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9ca3af; font-size: 10px; background: none; border: none; cursor: pointer; }
    .nav-item.active { color: #1a1c8f; font-weight: 600;}
    .nav-item i { font-size: 20px; }
    
    .nav-scan { margin-top: -35px; }
    .scan-btn { width: 60px; height: 60px; background: #1a1c8f; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; border: 5px solid #f8f9fa; box-shadow: 0 4px 12px rgba(26, 28, 143, 0.3); }

    .scan-icon {
      width: 30px; height: 30px;
      stroke: #ffffff; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* 🌟 ปุ่มแชท */
    .chat-fab {
      position: absolute;
      right: 16px;
      bottom: calc(100% + 12px);
      top: auto;
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 40;
    }
    .chat-fab svg {
      width: 28px; height: 28px;
      stroke: #1a1c8f; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* --- PIN Modal --- */
    .pin-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100; display: flex; flex-direction: column; justify-content: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; 
    }
    .pin-modal.show { opacity: 1; pointer-events: all; }
    .pin-container { 
      background: #f8f9fa; border-radius: 30px 30px 0 0; padding: 24px 20px 40px 20px; 
      display: flex; flex-direction: column; align-items: center; 
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      width: 100%; 
    }
    .pin-modal.show .pin-container { transform: translateY(0); }
    .pin-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 20px; }
    .pin-dots { display: flex; gap: 12px; margin-bottom: 30px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #e5e7eb; border: 1px solid #d1d5db; transition: background 0.2s; }
    .dot.filled { background: #6b7280; border-color: #6b7280; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 300px; }
    .key { width: 70px; height: 70px; border-radius: 50%; background: #eef1f5; color: #1a1c8f; font-size: 24px; font-weight: 500; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; margin: 0 auto; border: none; font-family: inherit; }
    .key:active { background: #d1d5db; }
    .key.action { background: transparent; font-size: 20px; color: #1a1c8f; }
    .forgot-btn { margin-top: 20px; font-size: 12px; color: #555; background: #e5e7eb; padding: 6px 16px; border-radius: 20px; border: none; cursor: pointer;}

    /* 🌟 Modal ขยายรูปบัตร (หรี่แสงทั้งจอ) */
    .expand-modal {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      z-index: 200;
      display: none;
      flex-direction: column;
      overflow: hidden;
      container-type: size;
    }
    
    /* 🌟 2. อัปเดตปุ่มให้เหมือนภาพ */
    .expand-header {
      padding: calc(env(safe-area-inset-top) + 8px) 20px 20px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #ffffff; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
    }
    
    .back-btn,
    .header-icons-expanded .icon-btn {
      background: rgba(190, 185, 225, 0.55);   /* วงกลมโปร่งเทาอมม่วงอ่อน */
      border: none;
      color: #ffffff;
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-size: 20px; cursor: pointer;
      box-shadow: none;
    }

    .header-icons-expanded { display: flex; gap: 12px; }

    .expand-card-container {
      position: absolute; top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%) rotate(90deg);
      display: flex; justify-content: center; align-items: center;
    }

    .expand-card-inner {
      flex-shrink: 0; 
      width: min(calc(96cqh), calc((96cqw) * 1.58));
      aspect-ratio: 1.58 / 1;
      position: relative; transition: transform 0.6s; transform-style: preserve-3d;
      cursor: pointer; perspective: 1000px;
    }

    .expand-card-inner.is-flipped { transform: rotateY(180deg); }

    .expand-card-front, .expand-card-back {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
      overflow: hidden; background: white;
    }

    .expand-card-back { transform: rotateY(180deg); }

    .expand-card-image {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* ปุ่ม Reset รูปภาพ */
    .reset-btn {
      position: absolute; bottom: 15px; right: 15px;
      width: 24px; height: 24px;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%; cursor: pointer; z-index: 999; opacity: 0.6; 
      transition: all 0.2s; display: flex; justify-content: center; align-items: center;
      color: white; font-size: 10px;
    }
    .reset-btn:hover, .reset-btn:active { 
      opacity: 1; background: rgba(255, 0, 0, 0.8); border-color: red; 
    }

    .solid-box-icon {
      stroke: none !important; 
    }
  </style>
</head>
<body>

  <!-- Inputs สำหรับอัปโหลดรูป -->
  <input type="file" id="uploadBanner1" accept="image/*" onchange="handleImageUpload(event, 'banner1')">
  <input type="file" id="uploadBanner2" accept="image/*" onchange="handleImageUpload(event, 'banner2')">
  
  <input type="file" id="uploadAnn1" accept="image/*" onchange="handleImageUpload(event, 'ann1')">
  <input type="file" id="uploadAnn2" accept="image/*" onchange="handleImageUpload(event, 'ann2')">
  <input type="file" id="uploadAnn3" accept="image/*" onchange="handleImageUpload(event, 'ann3')">
  <input type="file" id="uploadAnn4" accept="image/*" onchange="handleImageUpload(event, 'ann4')">
  <input type="file" id="uploadAnn5" accept="image/*" onchange="handleImageUpload(event, 'ann5')">

  <input type="file" id="uploadAvatar" accept="image/*" onchange="handleImageUpload(event, 'avatar')">
  <input type="file" id="uploadIdFront" accept="image/*" onchange="handleImageUpload(event, 'front')">
  <input type="file" id="uploadIdBack" accept="image/*" onchange="handleImageUpload(event, 'back')">

  <div class="app-container">
    
    <button class="reset-btn" onclick="resetImages()" title="ล้างรูปภาพทั้งหมด"><i class="fa-solid fa-trash-can"></i></button>

    <header>
      <div class="header-top">
        <div class="user-info">
          <div class="avatar-container" onclick="document.getElementById('uploadAvatar').click()">
            <div class="avatar" id="avatarImg"></div>
          </div>
          <div class="user-text">
            <p>สวัสดี <span class="online-badge"><span class="online-dot"></span>ONLINE</span></p>
            <h1>คุณ 🧌🧌🧌🧌🧌🧌🧌🧌🧌</h1>
          </div>
        </div>
        
        <div class="header-icons">
          <i class="fa-regular fa-bell"></i>
          <i class="fa-solid fa-power-off"></i>
        </div>
      </div>
    </header>

    <div class="main-scroll-area">
      <div class="blue-section">
        <div class="card-wrapper" id="cardWrapper">
          <div class="card-inner" id="myIdCard" onclick="handleCardClick(event)">
            
            <div class="card-front">
              <img src="" alt="Front ID" class="card-image" id="idFrontImg" style="background: #e2e8f0; display: none;">
              
              <div id="frontUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 12px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหน้า</p>
              </div>

              <div class="lock-overlay" id="lockScreen" onclick="showPinModal(event)">
                <svg class="lock-icon-svg" viewBox="0 0 24 24">
                  <path d="M17 8V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-1zM9 6a3 3 0 0 1 6 0v2H9V6zm3 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" />
                </svg>
                <p class="lock-text">คลิกเพื่อแสดงบัตร</p>
              </div>
            </div>

            <div class="card-back">
              <img src="" alt="Back ID" class="card-image" id="idBackImg" style="background: #e2e8f0; display: none;">
              
              <div id="backUploadPrompt" style="position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background: #f1f5f9; color:#64748b;">
                <i class="fa-solid fa-image" style="font-size: 30px; margin-bottom: 10px;"></i>
                <p style="font-size: 12px;">คลิกเพื่ออัปโหลดรูปบัตรด้านหลัง</p>
              </div>
            </div>

          </div>
        </div>

        <div class="card-action-bar" id="cardMenu">
          <button class="card-action-btn icon-only" id="btnInfo" onclick="handleActionClick('info', event)">
            <i class="fa-regular fa-id-badge"></i>
          </button>
          <button class="card-action-btn" id="btnExpand" onclick="handleActionClick('expand', event)">
            <i class="fa-solid fa-up-right-and-down-left-from-center"></i> ขยายรูปบัตร
          </button>
          <button class="card-action-btn icon-only" id="btnFlip" onclick="handleActionClick('flip', event)">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <div class="white-section">
        <div class="section-title">
          <h2>เมนูบริการ</h2>
          <a href="#">ทั้งหมด <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i></a>
        </div>
        
        <div class="menu-grid">
          
          <div class="menu-item" onclick="alert('ระบบตรวจสอบคำขอ')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24" class="search-request-icon">
                <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" ry="3.5"></rect>
                <circle cx="11" cy="11" r="5.5"></circle>
                <line x1="15" y1="15" x2="19" y2="19"></line>
                <circle cx="11" cy="9.3" r="1.7"></circle>
                <path d="M7.9 14 a3.1 3.1 0 0 1 6.2 0"></path>
              </svg>
            </div>
            <span>ตรวจสอบ<br>คำขอ</span>
          </div>

          <div class="menu-item" onclick="alert('ระบบการรับรองเอกสาร')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <polyline points="9 15 11 17 15 13"></polyline>
              </svg>
            </div>
            <span>การรับรอง<br>เอกสาร</span>
          </div>

          <div class="menu-item" onclick="alert('ระบบแจ้งย้ายที่อยู่')">
            <div class="menu-icon">
              <svg viewBox="0 0 24 24" class="solid-box-icon">

  <script>
    // ==========================================
    // 🌟 โค้ดสไลเดอร์แบบ Infinite Loop
    // ==========================================
    let autoSlideInterval;
    let userTouching = false;
    let isJumping = false;
    let currentIndex = 0;        // ดัชนีของแบนเนอร์จริง (0 หรือ 1)
    const REAL = 2;              // จำนวนแบนเนอร์จริง

    const carouselWrapper = document.getElementById('bannerCarousel');
    const carouselTrack = document.getElementById('carouselTrack');
    const dots = [document.getElementById('dot1'), document.getElementById('dot2')];

    // ลำดับในแทร็ก: [0]=โคลนของใบ2, [1]=ใบ1, [2]=ใบ2, [3]=โคลนของใบ1
    function slideEls() {
      return Array.from(carouselTrack.querySelectorAll('.banner'));
    }

    function setupLoop() {
      const real = Array.from(carouselTrack.querySelectorAll('.banner'));
      const first = real[0], last = real[real.length - 1];

      const cloneLast = last.cloneNode(true);
      cloneLast.id = 'bannerCloneBefore';
      cloneLast.querySelector('.banner-bg-img').id = 'bannerImgCloneBefore';
      cloneLast.querySelector('.banner-placeholder').id = 'bannerBgCloneBefore';
      cloneLast.removeAttribute('onclick');

      const cloneFirst = first.cloneNode(true);
      cloneFirst.id = 'bannerCloneAfter';
      cloneFirst.querySelector('.banner-bg-img').id = 'bannerImgCloneAfter';
      cloneFirst.querySelector('.banner-placeholder').id = 'bannerBgCloneAfter';
      cloneFirst.removeAttribute('onclick');

      carouselTrack.insertBefore(cloneLast, first);
      carouselTrack.appendChild(cloneFirst);
    }

    function slideCenter(el) {
      return el.offsetLeft + el.offsetWidth / 2 - carouselWrapper.clientWidth / 2;
    }

    function jumpTo(elIndex) {            // วาร์ปแบบไม่มีอนิเมชัน
      isJumping = true;
      carouselWrapper.style.scrollBehavior = 'auto';
      carouselWrapper.style.scrollSnapType = 'none';
      carouselWrapper.scrollLeft = slideCenter(slideEls()[elIndex]);
      requestAnimationFrame(() => {
        carouselWrapper.style.scrollSnapType = '';
        carouselWrapper.style.scrollBehavior = '';
        isJumping = false;
      });
    }

    function smoothTo(elIndex) {
      carouselWrapper.scrollTo({ left: slideCenter(slideEls()[elIndex]), behavior: 'smooth' });
    }

    function nearestElIndex() {
      const els = slideEls();
      const center = carouselWrapper.scrollLeft + carouselWrapper.clientWidth / 2;
      let best = 0, min = Infinity;
      els.forEach((s, i) => {
        const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - center);
        if (d < min) { min = d; best = i; }
      });
      return best;
    }

    // ถ้าหยุดอยู่ที่ตัวโคลน ให้วาร์ปกลับตัวจริง
    function fixIfOnClone() {
      const i = nearestElIndex();
      if (i === 0) jumpTo(REAL);            // โคลนก่อนหน้า -> ใบสุดท้ายจริง
      else if (i === REAL + 1) jumpTo(1);   // โคลนถัดไป -> ใบแรกจริง
    }

    function updateDots(index) {
      dots.forEach((d, i) => d.classList.toggle('active', i === index));
    }

    function startAutoSlide() {
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(() => {
        if (userTouching || isJumping) return;
        smoothTo(nearestElIndex() + 1);     // เลื่อนไปทางขวาเสมอ ไม่ย้อน
      }, 3500);
    }
    function stopAutoSlide() { clearInterval(autoSlideInterval); }

    carouselWrapper.addEventListener('touchstart', () => { userTouching = true; stopAutoSlide(); }, { passive: true });
    carouselWrapper.addEventListener('touchend', () => { userTouching = false; setTimeout(startAutoSlide, 2500); }, { passive: true });

    let scrollTimer;
    carouselWrapper.addEventListener('scroll', () => {
      if (isJumping) return;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        fixIfOnClone();
        const i = nearestElIndex();
        // map ตำแหน่งในแทร็ก -> ดัชนีจริง (0..REAL-1)
        currentIndex = (i - 1 + REAL) % REAL;
        updateDots(currentIndex);
      }, 80);
    }, { passive: true });

    // 🌟 ฟังก์ชันสำหรับอัปเดตความกว้างของแบนเนอร์
    function updateBannerWidths() {
      const wrapperWidth = carouselWrapper.clientWidth; 
      const targetWidth = wrapperWidth * 0.80; 
      
      const banners = carouselTrack.querySelectorAll('.banner');
      banners.forEach(banner => {
        banner.style.width = targetWidth + 'px';
      });
    }

    // 🌟 ฟังก์ชัน Sync รูปภาพไปยังโคลน
    function syncClones() {
      const pairs = [
        ['bannerImg2', 'bannerBg2', 'bannerImgCloneBefore', 'bannerBgCloneBefore'],
        ['bannerImg1', 'bannerBg1', 'bannerImgCloneAfter',  'bannerBgCloneAfter']
      ];
      pairs.forEach(([srcImg, srcBg, cImg, cBg]) => {
        const a = document.getElementById(srcImg), b = document.getElementById(srcBg);
        const ci = document.getElementById(cImg), cb = document.getElementById(cBg);
        if (!a || !ci) return;
        ci.src = a.src;
        ci.style.display = a.style.display;
        cb.style.display = b.style.display;
      });
    }

    // ==========================================
    // 🌟 โค้ดระบบอื่นๆ (PIN, บัตร, อัปโหลด)
    // ==========================================
    let pinCode = "";
    const correctPin = "12345678"; 
    let isFlipped = false;
    let isUnlocked = false; 
    let hasFrontImage = false;
    let hasBackImage = false;

    window.onload = function() {
      updateBannerWidths();
      setupLoop();
      updateBannerWidths();          // ตั้งความกว้างให้ตัวโคลนด้วย
      loadImagesFromStorage();
      setTimeout(() => { jumpTo(1); startAutoSlide(); }, 200);

      window.addEventListener('resize', () => {
        updateBannerWidths();
        jumpTo(currentIndex + 1);
      });
    };

    function handleActionClick(action, event) {
      event.stopPropagation(); 
      if (!isUnlocked) {
        alert('กรุณาคลิกที่บัตรเพื่อใส่รหัสผ่านก่อนใช้งาน');
        showPinModal(event);
        return;
      }
      if (action === 'info') alert('ดูข้อมูลบัตร');
      else if (action === 'expand') expandCard();
      else if (action === 'flip') flipCard();
    }

    function loadImagesFromStorage() {
      const savedAvatar = localStorage.getItem('thaid_avatar');
      const savedFront = localStorage.getItem('thaid_front');
      const savedBack = localStorage.getItem('thaid_back');
      const savedBanner1 = localStorage.getItem('thaid_banner1');
      const savedBanner2 = localStorage.getItem('thaid_banner2');
      
      const savedAnn1 = localStorage.getItem('thaid_ann1');
      const savedAnn2 = localStorage.getItem('thaid_ann2');
      const savedAnn3 = localStorage.getItem('thaid_ann3');
      const savedAnn4 = localStorage.getItem('thaid_ann4');
      const savedAnn5 = localStorage.getItem('thaid_ann5');

      if (savedAvatar) document.getElementById('avatarImg').style.backgroundImage = `url('${savedAvatar}')`;
      
      if (savedFront) {
        const img = document.getElementById('idFrontImg');
        img.src = savedFront;
        img.style.display = 'block';
        document.getElementById('frontUploadPrompt').style.display = 'none';
        hasFrontImage = true;
      }
      
      if (savedBack) {
        const img = document.getElementById('idBackImg');
        img.src = savedBack;
        img.style.display = 'block';
        document.getElementById('backUploadPrompt').style.display = 'none';
        hasBackImage = true;
      }

      if (savedBanner1) {
        document.getElementById('bannerImg1').src = savedBanner1;
        document.getElementById('bannerImg1').style.display = 'block';
        document.getElementById('bannerBg1').style.display = 'none'; 
      }

      if (savedBanner2) {
        document.getElementById('bannerImg2').src = savedBanner2;
        document.getElementById('bannerImg2').style.display = 'block';
        document.getElementById('bannerBg2').style.display = 'none'; 
      }
      
      syncClones(); // อัปเดตรูปโคลนหลังโหลดเสร็จ

      if (savedAnn1) { document.getElementById('annImg1').src = savedAnn1; document.getElementById('annImg1').style.display = 'block'; document.getElementById('annBg1').style.display = 'none'; }
      if (savedAnn2) { document.getElementById('annImg2').src = savedAnn2; document.getElementById('annImg2').style.display = 'block'; document.getElementById('annBg2').style.display = 'none'; }
      if (savedAnn3) { document.getElementById('annImg3').src = savedAnn3; document.getElementById('annImg3').style.display = 'block'; document.getElementById('annBg3').style.display = 'none'; }
      if (savedAnn4) { document.getElementById('annImg4').src = savedAnn4; document.getElementById('annImg4').style.display = 'block'; document.getElementById('annBg4').style.display = 'none'; }
      if (savedAnn5) { document.getElementById('annImg5').src = savedAnn5; document.getElementById('annImg5').style.display = 'block'; document.getElementById('annBg5').style.display = 'none'; }
    }

    function handleCardClick(event) {
      if (!isUnlocked) return;
      event.stopPropagation();

      if (!isFlipped && !hasFrontImage) {
        document.getElementById('uploadIdFront').click();
      } else if (isFlipped && !hasBackImage) {
        document.getElementById('uploadIdBack').click();
      } else {
        flipCard();
      }
    }

    function showPinModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('pinModal').classList.add('show');
      pinCode = "";
      updateDots();
    }

    function closePinModal() {
      document.getElementById('pinModal').classList.remove('show');
    }

    function inputPin(num) {
      if (pinCode.length < 8) {
        pinCode += num;
        updateDots();
        if (pinCode.length === 8) {
          setTimeout(() => {
            if (pinCode === correctPin) {
              unlockCard();
            } else {
              alert("❌ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่");
              pinCode = "";
              updateDots();
            }
          }, 300);
        }
      }
    }

    function deletePin() {
      pinCode = pinCode.slice(0, -1);
      updateDots();
    }

    function updateDots() { // (ฟังก์ชันนี้ใช้กับ PIN dots)
      const pinDots = document.querySelectorAll('.dot');
      pinDots.forEach((dot, index) => {
        if (index < pinCode.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function unlockCard() {
      closePinModal();
      isUnlocked = true;
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('myIdCard').classList.remove('is-flipped');
      isFlipped = false;
    }

    function flipCard() {
      if (!isUnlocked) return;
      const card = document.getElementById('myIdCard');
      isFlipped = !isFlipped;
      if (isFlipped) card.classList.add('is-flipped');
      else card.classList.remove('is-flipped');
    }

    function expandCard() {
      if (!isUnlocked) return;
      if (!hasFrontImage && !hasBackImage) {
        alert("กรุณาอัปโหลดรูปบัตรก่อนขยายครับ");
        return;
      }
      const frontSrc = document.getElementById('idFrontImg').src;
      const backSrc = document.getElementById('idBackImg').src;
      document.getElementById('expandedFrontImg').src = frontSrc || backSrc;
      document.getElementById('expandedBackImg').src = backSrc || frontSrc;
      document.getElementById('expandModal').style.display = 'flex';
      document.getElementById('expandedCard').classList.remove('is-flipped');
    }

    function closeExpandCard() {
      document.getElementById('expandModal').style.display = 'none';
    }

    function flipExpandedCard() {
      const expandedCard = document.getElementById('expandedCard');
      expandedCard.classList.toggle('is-flipped');
    }

    function handleImageUpload(event, type) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imageUrl = e.target.result;
          
          if (type === 'avatar') {
            document.getElementById('avatarImg').style.backgroundImage = `url('${imageUrl}')`;
            localStorage.setItem('thaid_avatar', imageUrl);
          } else if (type === 'front') {
            const img = document.getElementById('idFrontImg');
            img.src = imageUrl;
            img.style.display = 'block';
            document.getElementById('frontUploadPrompt').style.display = 'none';
            hasFrontImage = true;
            localStorage.setItem('thaid_front', imageUrl);
          } else if (type === 'back') {
            const img = document.getElementById('idBackImg');
            img.src = imageUrl;
            img.style.display = 'block';
            document.getElementById('backUploadPrompt').style.display = 'none';
            hasBackImage = true;
            localStorage.setItem('thaid_back', imageUrl);
          } else if (type === 'banner1') {
            document.getElementById('bannerImg1').src = imageUrl;
            document.getElementById('bannerImg1').style.display = 'block';
            document.getElementById('bannerBg1').style.display = 'none';
            localStorage.setItem('thaid_banner1', imageUrl);
          } else if (type === 'banner2') {
            document.getElementById('bannerImg2').src = imageUrl;
            document.getElementById('bannerImg2').style.display = 'block';
            document.getElementById('bannerBg2').style.display = 'none';
            localStorage.setItem('thaid_banner2', imageUrl);
          } else if (type === 'ann1') {
            document.getElementById('annImg1').src = imageUrl;
            document.getElementById('annImg1').style.display = 'block';
            document.getElementById('annBg1').style.display = 'none';
            localStorage.setItem('thaid_ann1', imageUrl);
          } else if (type === 'ann2') {
            document.getElementById('annImg2').src = imageUrl;
            document.getElementById('annImg2').style.display = 'block';
            document.getElementById('annBg2').style.display = 'none';
            localStorage.setItem('thaid_ann2', imageUrl);
          } else if (type === 'ann3') {
            document.getElementById('annImg3').src = imageUrl;
            document.getElementById('annImg3').style.display = 'block';
            document.getElementById('annBg3').style.display = 'none';
            localStorage.setItem('thaid_ann3', imageUrl);
          } else if (type === 'ann4') {
            document.getElementById('annImg4').src = imageUrl;
            document.getElementById('annImg4').style.display = 'block';
            document.getElementById('annBg4').style.display = 'none';
            localStorage.setItem('thaid_ann4', imageUrl);
          } else if (type === 'ann5') {
            document.getElementById('annImg5').src = imageUrl;
            document.getElementById('annImg5').style.display = 'block';
            document.getElementById('annBg5').style.display = 'none';
            localStorage.setItem('thaid_ann5', imageUrl);
          }

          // อัปเดตโคลนทุกครั้งที่รูปเปลี่ยน
          syncClones();
        };
        reader.readAsDataURL(file); 
      }
      event.target.value = ''; 
    }

    function resetImages() {
      if(confirm('คุณต้องการล้างรูปภาพทั้งหมดและเริ่มต้นใหม่หรือไม่?')) {
        localStorage.removeItem('thaid_avatar');
        localStorage.removeItem('thaid_front');
        localStorage.removeItem('thaid_back');
        localStorage.removeItem('thaid_banner1');
